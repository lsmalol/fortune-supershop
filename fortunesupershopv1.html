<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fortune SuperShop · Inventario</title>
<style>
:root{
  --bg:#fff;--bg2:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;
  --blue:#0071e3;--blue-h:#0077ed;--nav:rgba(255,255,255,.75);
  --green:#1d7a35;--green-bg:#e6f5ea;--amber:#8a5200;--amber-bg:#fff0d1;--red:#c0241c;--red-bg:#fde8e6;--gray-bg:#ececf0;
  --shadow:0 4px 24px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#000;--bg2:#161617;--card:#1c1c1e;--text:#f5f5f7;--muted:#a1a1a6;--line:#38383a;
  --blue:#2997ff;--blue-h:#4aa8ff;--nav:rgba(22,22,23,.75);
  --green:#52d273;--green-bg:#12301c;--amber:#ffc04d;--amber-bg:#3a2a07;--red:#ff6961;--red-bg:#3d1512;--gray-bg:#2c2c2e;
  --shadow:0 4px 24px rgba(0,0,0,.5);
}}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.47;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
body:has(dialog[open]){overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.nav{position:sticky;top:0;z-index:10;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1200px;margin:0 auto;padding:12px 22px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}

.hero{padding:56px 0 28px;text-align:center}
.hero h1{font-size:clamp(34px,6vw,56px);line-height:1.07;font-weight:700;letter-spacing:-.03em}
.hero p{margin-top:10px;font-size:clamp(17px,2.4vw,21px);color:var(--muted);letter-spacing:-.01em}

.search{position:relative;max-width:560px;margin:0 auto}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{width:100%;height:46px;border:0;border-radius:12px;background:var(--bg2);padding:0 14px 0 42px;font-size:17px;outline-offset:2px}
.search input::placeholder{color:var(--muted)}

.pills{display:flex;gap:8px;overflow-x:auto;padding:20px 22px 6px;margin:0 -22px;scrollbar-width:none;justify-content:flex-start}
.pills::-webkit-scrollbar{display:none}
@media(min-width:900px){.pills{justify-content:center;flex-wrap:wrap;overflow:visible}}
.pill{flex:none;border:0;background:var(--bg2);color:var(--text);padding:8px 16px;border-radius:980px;font-size:14px;cursor:pointer;transition:background .15s,color .15s}
.pill:hover{background:var(--line)}
.pill[aria-pressed="true"]{background:var(--text);color:var(--bg)}

.meta{margin:22px 0 14px;font-size:14px;color:var(--muted)}
.banner{margin:18px 0 0;padding:12px 16px;border-radius:12px;background:var(--amber-bg);color:var(--amber);font-size:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding-bottom:64px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
.card{display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:0;cursor:pointer;overflow:hidden;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shadow)}
.card:active{transform:scale(.985)}
.thumb{aspect-ratio:1/1;background:#fff;display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;padding:14px}
.thumb svg{width:44%;height:44%;color:#9a9aa0;opacity:.6}
.card-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.cat{font-size:12px;color:var(--muted)}
.name{font-size:17px;font-weight:600;line-height:1.25;letter-spacing:-.015em}
.sku{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.price{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:980px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-green{background:var(--green-bg);color:var(--green)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-gray{background:var(--gray-bg);color:var(--muted)}

.empty{grid-column:1/-1;text-align:center;padding:64px 0;color:var(--muted)}
.empty strong{display:block;font-size:21px;color:var(--text);margin-bottom:4px}
.skel{height:330px;border-radius:20px;background:linear-gradient(90deg,var(--bg2),var(--line),var(--bg2));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}

footer{border-top:1px solid var(--line);padding:24px 0 40px;font-size:13px;color:var(--muted);text-align:center}

/* Detalle */
dialog{border:0;padding:0;background:var(--card);color:var(--text);border-radius:28px;width:min(980px,calc(100% - 32px));max-height:calc(100dvh - 48px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
dialog[open]{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.close{position:sticky;top:12px;float:right;margin:12px 12px -44px 0;z-index:2;width:32px;height:32px;border:0;border-radius:50%;background:var(--gray-bg);color:var(--muted);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.close:hover{color:var(--text)}
.d{display:grid;grid-template-columns:1.05fr 1fr}
.d-img{background:#fff;display:grid;place-items:center;min-height:360px;position:sticky;top:0;align-self:start}
.d-img img{width:100%;max-height:560px;object-fit:contain;padding:28px}
.d-img svg{width:34%;color:#9a9aa0;opacity:.6}
.d-info{padding:40px 36px 36px;display:flex;flex-direction:column;gap:14px;min-width:0}
.d-info h2{font-size:clamp(26px,3.4vw,34px);line-height:1.12;font-weight:700;letter-spacing:-.025em}
.d-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.d-price{font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.d-stock{font-size:14px;color:var(--muted);margin-top:-8px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;text-decoration:none;transition:background .15s}
.cta:hover{background:var(--blue-h)}
.cta.sec{background:var(--bg2);color:var(--blue)}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:-6px}
.sec-t{font-size:19px;font-weight:600;letter-spacing:-.015em;margin-top:10px}
.specs{border-top:1px solid var(--line)}
.specs div{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.specs dt{color:var(--muted)}
.specs dd{margin:0}
.specs .full{grid-template-columns:1fr}
.desc{font-size:16px;white-space:pre-line}
.rel{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.rel::-webkit-scrollbar{display:none}
.rel button{flex:none;width:104px;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.rel .rt{aspect-ratio:1/1;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.rel .rt img{width:100%;height:100%;object-fit:contain;padding:8px}
.rel .rt svg{width:40%;color:#9a9aa0;opacity:.6}
.rel span{display:block;margin-top:6px;font-size:12px;line-height:1.3;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:760px){
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:28px 28px 0 0;max-height:92dvh}
  .d{grid-template-columns:1fr}
  .d-img{position:static;min-height:0;aspect-ratio:4/3}
  .d-info{padding:24px 20px calc(28px + env(safe-area-inset-bottom,0px))}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const $ = s => document.querySelector(s);
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const key = s => norm(s).replace(/[^a-z0-9]/g,"");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></svg>';

let products = [], activeCat = "Todo", term = "";

function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++} else q=false } else f+=c }
    else if(c=='"') q=true;
    else if(c==","){row.push(f);f=""}
    else if(c=="\n"){row.push(f);rows.push(row);row=[];f=""}
    else if(c!="\r") f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
function fromCSV(text){
  const rows=parseCSV(text).filter(r=>r.some(c=>c.trim()));
  if(rows.length<2) return [];
  const h=rows[0].map(key), ix=n=>h.findIndex(x=>n.includes(x));
  const col={sku:ix(["sku"]),parte:ix(["parte","nombre"]),categoria:ix(["categoria"]),specs:ix(["especificacionesdetalles","especificaciones"]),precio:ix(["preciomxn","precio"]),stock:ix(["stock"]),estado:ix(["estado"]),img:ix(["urlimagen","imagen"]),desc:ix(["descripcion"])};
  if(col.sku<0||col.parte<0) throw new Error("encabezados");
  const g=(r,k)=>col[k]>=0?(r[col[k]]||"").trim():"";
  return rows.slice(1).map(r=>({sku:g(r,"sku"),parte:g(r,"parte"),categoria:g(r,"categoria"),specs:g(r,"specs"),precio:g(r,"precio"),stock:g(r,"stock"),estado:g(r,"estado"),img:g(r,"img"),desc:g(r,"desc")})).filter(p=>p.sku&&p.parte);
}

function imgUrl(p){
  const u=(p.img||"").trim();
  if(/^https?:\/\//i.test(u)){
    const m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||u.match(/drive\.google\.com\/(?:open|uc)\?(?:.*&)?id=([\w-]+)/);
    return m?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w1000`:u;
  }
  return IMGS[p.sku]||"";
}
function money(v){
  const s=String(v||"").trim(); if(!s) return "Consultar";
  const m=s.match(/^\$?\s*([\d,]+(?:\.\d+)?)$/);
  if(m){const n=parseFloat(m[1].replace(/,/g,""));return new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",minimumFractionDigits:n%1?2:0,maximumFractionDigits:2}).format(n)}
  return s.startsWith("$")?s:"$"+s;
}
function stockText(v){
  const s=String(v??"").trim(); if(!s) return "";
  if(/^\d+(\.0+)?$/.test(s)) return parseInt(s,10)>0?`${parseInt(s,10)} en existencia`:"Sin existencia por ahora";
  return `${s} en existencia`;
}
function state(e){
  const n=norm(e);
  if(n.includes("agot")) return ["b-red",e];
  if(n.includes("poca")||n.includes("camino")) return ["b-amber",e];
  if(n.includes("dispon")) return ["b-green",e];
  return ["b-gray",e||"Consultar"];
}
function specsList(t){
  if(!t) return [];
  let p=t.split(/\n|;|\||\s\/\s/).map(s=>s.trim()).filter(Boolean);
  if(p.length===1&&t.includes(",")) p=t.split(",").map(s=>s.trim()).filter(Boolean);
  return p.map(s=>{const i=s.indexOf(":");return i>0&&i<40?{k:s.slice(0,i).trim(),v:s.slice(i+1).trim()}:{k:"",v:s}});
}
function picture(p,eager){
  const u=imgUrl(p);
  return u?`<img src="${esc(u)}" alt="${esc(p.parte)}" data-fb loading="${eager?"eager":"lazy"}">`:CHIP;
}
document.addEventListener("error",e=>{
  const t=e.target;
  if(t.tagName==="IMG"&&t.hasAttribute("data-fb")){const s=document.createElement("span");s.innerHTML=CHIP;t.replaceWith(s.firstChild)}
},true);

function render(){
  const cats=["Todo",...new Set(products.map(p=>p.categoria).filter(Boolean))];
  $("#pills").innerHTML=cats.map(c=>`<button class="pill" data-c="${esc(c)}" aria-pressed="${c===activeCat}">${esc(c)}</button>`).join("");
  const terms=norm(term).split(/\s+/).filter(Boolean);
  const list=products.filter(p=>(activeCat==="Todo"||p.categoria===activeCat)&&terms.every(t=>norm([p.sku,p.parte,p.categoria,p.specs].join(" ")).includes(t)));
  $("#count").textContent=list.length===1?"1 producto":`${list.length} productos`;
  $("#grid").innerHTML=list.length?list.map(p=>{const [cl,lb]=state(p.estado);return `
    <button class="card" data-sku="${esc(p.sku)}" aria-label="Ver ${esc(p.parte)}">
      <div class="thumb">${picture(p)}</div>
      <div class="card-b">
        <span class="cat">${esc(p.categoria)}</span>
        <span class="name">${esc(p.parte)}</span>
        <span class="sku">${esc(p.sku)}</span>
        <div class="row"><span class="price">${esc(money(p.precio))}</span><span class="badge ${cl}">${esc(lb)}</span></div>
      </div>
    </button>`}).join(""):`<div class="empty"><strong>Sin resultados</strong>Prueba con otro nombre, SKU o categoría.</div>`;
}

function openProduct(sku){
  const p=products.find(x=>x.sku===sku); if(!p) return;

  const ig=`https://ig.me/m/${encodeURIComponent(CONFIG.INSTAGRAM_USER)}?text=${encodeURIComponent(msg)}`;
  const sp=specsList(p.specs);

        <h2 id="d-title">${esc(p.parte)}</h2>
        <div class="sku">SKU: ${esc(p.sku)}</div>
        <div class="d-price">${esc(money(p.precio))}</div>
        <div class="d-stock">${esc(stockText(p.stock))}</div>
        <a class="cta ${out?"sec":""}" href="${esc(ig)}" target="_blank" rel="noopener">${out?"Preguntar por Instagram":"Pedir por Instagram"}</a>
        <p class="note">Se abre un chat con el producto ya escrito.</p>
        ${sp.length?`<h3 class="sec-t">Especificaciones</h3><dl class="specs">${sp.map(s=>s.k?`<div><dt>${esc(s.k)}</dt><dd>${esc(s.v)}</dd></div>`:`<div class="full"><dd>${esc(s.v)}</dd></div>`).join("")}</dl>`:""}
        ${p.desc?`<h3 class="sec-t">Descripción</h3><p class="desc">${esc(p.desc)}</p>`:""}
        ${rel.length?`<h3 class="sec-t">Más en ${esc(p.categoria)}</h3><div class="rel">${rel.map(r=>`<button data-rel="${esc(r.sku)}"><div class="rt">${picture(r)}</div><span>${esc(r.parte)}</span></button>`).join("")}</div>`:""}
      </div>
    </div>`;
  if(!$("#dlg").open) $("#dlg").showModal();
  $("#dlg").scrollTo(0,0);
  history.replaceState(null,"","#"+encodeURIComponent(p.sku));
}

$("#q").addEventListener("input",e=>{term=e.target.value;render()});
$("#pills").addEventListener("click",e=>{const b=e.target.closest(".pill");if(b){activeCat=b.dataset.c;render()}});
$("#grid").addEventListener("click",e=>{const c=e.target.closest(".card");if(c) openProduct(c.dataset.sku)});
$("#dlg").addEventListener("click",e=>{
  if(e.target===$("#dlg")||e.target.closest("[data-close]")) return $("#dlg").close();
  const r=e.target.closest("[data-rel]"); if(r) openProduct(r.dataset.rel);
});
$("#dlg").addEventListener("close",()=>history.replaceState(null,"",location.pathname+location.search));

function sheetUrl(){
  return CONFIG.SHEET_CSV_URL||`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}`;
}
async function init(){
  $("#brand").textContent=CONFIG.STORE_NAME;
  document.title=CONFIG.STORE_NAME+" · Inventario";
  $("#grid").innerHTML=Array(8).fill('<div class="skel"></div>').join("");
  let note="";
  try{
    const r=await fetch(sheetUrl(),{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    products=fromCSV(await r.text());
    if(!products.length) throw new Error("vacía");
  }catch(err){
    products=SNAPSHOT;
    note=`No se pudo leer tu hoja de Google en este momento. Mostrando la última copia guardada del inventario (${SNAPSHOT_DATE}).`;
  }
  if(note) $("#banner").innerHTML=`<div class="banner">${esc(note)}</div>`;
  render();
  const h=decodeURIComponent(location.hash.slice(1)); if(h) openProduct(h);
}
init();
</script>
</body>
</html>
