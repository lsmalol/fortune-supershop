}
@media (prefers-color-scheme:dark){

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);

button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.brand{font-weight:600;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.search{position:relative;flex:1;max-width:460px;margin-left:auto}
.search input{width:100%;height:38px;border-radius:10px;border:1px solid transparent;background:var(--bg-soft);
  padding:0 36px 0 38px;font-size:15px}
.search input:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.search svg{position:absolute;left:12px;top:10px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.search .clear{position:absolute;right:6px;top:6px;width:26px;height:26px;border:0;border-radius:50%;
  background:transparent;color:var(--muted);cursor:pointer;display:none;font-size:18px;line-height:1}
.search .clear.on{display:block}

main{max-width:1180px;margin:0 auto;padding:0 20px 80px}
.hero{padding:56px 0 28px}
.hero h1{margin:0;font-size:clamp(34px,6vw,56px);line-height:1.05;letter-spacing:-.025em;font-weight:700}
.hero p{margin:12px 0 0;font-size:clamp(17px,2.2vw,21px);color:var(--muted);max-width:620px}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;flex:1;min-width:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;
  font-size:14px;cursor:pointer;white-space:nowrap}
.chip small{color:var(--muted);margin-left:5px}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.count{color:var(--muted);font-size:14px;margin:6px 0 18px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:0;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);
  transition:box-shadow .2s ease,transform .2s ease}
.card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.pic{aspect-ratio:4/3;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain;background:#fff}
.pic svg{width:34%;height:auto;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-size:16px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.sku{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px}
.price{font-size:19px;font-weight:600;letter-spacing:-.01em}
.price small{font-size:12px;font-weight:400;color:var(--muted);margin-left:3px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}

.st.ok{color:var(--ok)} .st.low{color:var(--low)} .st.soon{color:var(--soon)} .st.out{color:var(--out)}

.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty h2{color:var(--text);margin:0 0 6px;font-size:22px}
.empty button{margin-top:14px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 20px;cursor:pointer}

dialog{border:0;padding:0;border-radius:24px;width:min(880px,calc(100vw - 24px));max-height:calc(100vh - 24px);
  background:var(--bg);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

.d .pic{aspect-ratio:auto;min-height:340px}
.d .pic svg{width:30%}
.dbody{padding:32px 30px;display:flex;flex-direction:column;gap:14px}
.dbody h2{margin:0;font-size:26px;line-height:1.15;letter-spacing:-.02em}
.dprice{font-size:30px;font-weight:600;letter-spacing:-.02em}
.dprice small{font-size:14px;font-weight:400;color:var(--muted);margin-left:4px}
.dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:15px;border-top:1px solid var(--line);padding-top:14px}
.dl dt{color:var(--muted)} .dl dd{margin:0}
.desc{margin:0;font-size:15px;color:var(--text)}
.buy{display:block;text-align:center;text-decoration:none;background:var(--accent);color:var(--accent-ink);
  border-radius:999px;padding:13px 20px;font-weight:600;font-size:16px;margin-top:6px}
.buy:hover{filter:brightness(1.08)}
.hint{font-size:13px;color:var(--muted);margin:0}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:0;background:var(--bg-soft);
  color:var(--text);font-size:20px;line-height:1;cursor:pointer;z-index:2}
@media (max-width:700px){
  .d{grid-template-columns:1fr}.d .pic{min-height:220px;aspect-ratio:4/3}
  .dbody{padding:22px 20px 26px}
  .brand{font-size:15px}.top-in{padding:10px 14px;gap:10px}
  main{padding:0 14px 60px}.hero{padding:34px 0 18px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .info{padding:12px 12px 14px}.name{font-size:14px}.price{font-size:16px}
  .row{flex-direction:column;align-items:flex-start;gap:4px}
}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);
  padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{border-top:1px solid var(--line);padding:22px 20px 40px;text-align:center;color:var(--muted);font-size:13px}
.foot a{color:var(--accent);text-decoration:none}
.fatal{max-width:560px;margin:80px auto;padding:20px;border:1px solid var(--out);border-radius:14px;color:var(--out)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

      if (!g(r, idx.sku).trim() || !g(r, idx.name).trim()) continue;
      out.push([g(r, idx.sku), g(r, idx.name), g(r, idx.cat), g(r, idx.spec), g(r, idx.price),
                g(r, idx.stock), g(r, idx.status), g(r, idx.img), g(r, idx.desc)]);
    }
    return out.length ? out : null;
  }

  /* ===== ESTADO ===== */
  var products = [];
  var state = { q: '', cat: 'Todos', onlyAvail: false };

  function money(p) {
    if (isNaN(p.priceNum)) return null;
    return '$' + p.priceNum.toLocaleString('es-MX', { maximumFractionDigits: 2 });
  }
  function statusEl(p) {
    var s = el('span', 'st ' + p.key);
    s.appendChild(el('i'));
    s.appendChild(document.createTextNode(p.status));
    return s;
  }
  function picEl(p) {
    var pic = el('div', 'pic');
    function fallback() { pic.innerHTML = iconSvg(p.cat); }
    var src = '';
    if (/^https?:\/\//i.test(p.img) || /^(\.\/|[\w-]+\/)[^\s]*\.(png|jpe?g|webp|gif|svg)$/i.test(p.img)) src = p.img;
    else if (CONFIG.IMG_DIR && p.sku) src = CONFIG.IMG_DIR + encodeURIComponent(p.sku) + '.' + CONFIG.IMG_EXT;
    if (src) {
      var im = new Image();
      im.alt = p.name; im.loading = 'lazy'; im.decoding = 'async';
      im.onerror = fallback;
      im.src = src;
      pic.appendChild(im);
    } else fallback();
    return pic;
  }

  function matches(p) {
    if (state.cat !== 'Todos' && p.cat !== state.cat) return false;
    if (state.onlyAvail && p.key !== 'ok' && p.key !== 'low') return false;
    if (!state.q) return true;
    var hay = norm([p.name, p.sku, p.spec, p.desc, p.cat].join(' '));
    var words = norm(state.q).split(/\s+/);
    for (var i = 0; i < words.length; i++) if (words[i] && hay.indexOf(words[i]) < 0) return false;
    return true;
  }

  function renderChips() {
    var box = $('chips'), counts = {}, order = [];
    box.textContent = '';
    products.forEach(function (p) { if (!(p.cat in counts)) { counts[p.cat] = 0; order.push(p.cat); } counts[p.cat]++; });
    [['Todos', products.length]].concat(order.map(function (c) { return [c, counts[c]]; })).forEach(function (pair) {
      var b = el('button', 'chip', pair[0]);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(state.cat === pair[0]));
      b.appendChild(el('small', null, String(pair[1])));
      b.addEventListener('click', function () { state.cat = pair[0]; renderChips(); renderGrid(); });
      box.appendChild(b);
    });
  }

  function renderGrid() {
    var grid = $('grid'), list = products.filter(matches);
    grid.textContent = '';
    list.forEach(function (p) {
      var card = el('button', 'card');
      card.type = 'button';
      card.setAttribute('aria-label', 'Ver detalle de ' + p.name);
      card.appendChild(picEl(p));
      var info = el('div', 'info');
      info.appendChild(el('div', 'name', p.name));
      info.appendChild(el('div', 'sku', p.sku));
      var row = el('div', 'row');
      var price = el('div', 'price', money(p) || 'Consultar');
      if (p.priceNote) price.appendChild(el('small', null, 'MXN · ' + p.priceNote.toLowerCase()));
      else if (money(p)) price.appendChild(el('small', null, 'MXN'));
      row.appendChild(price);
      row.appendChild(statusEl(p));
      info.appendChild(row);
      card.appendChild(info);
      card.addEventListener('click', function () { openDetail(p); });
      grid.appendChild(card);
    });
    $('count').textContent = list.length === 1 ? '1 producto' : list.length + ' productos';
    var empty = list.length === 0;
    $('empty').hidden = !empty;
    if (empty) $('emptyMsg').textContent = state.q ? 'No encontramos «' + state.q + '». Prueba con otro nombre, SKU o especificación.' : 'No hay productos con estos filtros.';
  }

  /* ===== DETALLE + PEDIDO ===== */
  function orderMessage(p) { return 'Hola, me interesa este producto: ' + p.name + ' (SKU: ' + p.sku + ')'; }
  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('on'); }, 4200);
  }
  function copyText(txt) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt);
    } catch (e) {}
    return Promise.reject(new Error('sin portapapeles'));
  }

  function openDetail(p) {
    var box = $('dbox'), dlg = $('dlg');
    box.textContent = '';
    box.appendChild(picEl(p));
    var b = el('div', 'dbody');
    b.appendChild(el('h2', null, p.name));
    var pr = el('div', 'dprice', money(p) || 'Consultar');
    if (money(p)) pr.appendChild(el('small', null, 'MXN' + (p.priceNote ? ' · ' + p.priceNote.toLowerCase() : '')));
    b.appendChild(pr);
    if (p.desc) b.appendChild(el('p', 'desc', p.desc));
    var dl = el('dl', 'dl');
    function add(k, v) { if (!v) return; dl.appendChild(el('dt', null, k)); dl.appendChild(el('dd', null, v)); }
    add('SKU', p.sku);
    add('Categoría', p.cat);
    add('Especificaciones', p.spec);
    var dt = el('dt', null, 'Disponibilidad'), dd = el('dd');
    dd.appendChild(statusEl(p));
    dl.appendChild(dt); dl.appendChild(dd);
    if (p.stockTxt) add('Existencias', p.stockTxt);
    b.appendChild(dl);

    var a = el('a', 'buy', 'Pedir por Instagram');
    a.href = 'https://ig.me/m/' + CONFIG.IG_USER;
    a.target = '_blank'; a.rel = 'noopener';
    a.addEventListener('click', function () {
      copyText(orderMessage(p)).then(function () {
        toast('Mensaje copiado. Pégalo en el chat de @' + CONFIG.IG_USER + '.');
      }, function () {
        toast('Escribe en el chat: ' + orderMessage(p));
      });
    });
    b.appendChild(a);
    b.appendChild(el('p', 'hint', 'Al tocar, se copia el mensaje con el nombre y SKU y se abre el chat de @' + CONFIG.IG_USER + '.'));
    box.appendChild(b);
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  }
  function closeDetail() {
    var dlg = $('dlg');
    if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open');
  }

  /* ===== ARRANQUE ===== */
  function setData(rows, note) {
    products = rows.map(buildProduct);
    if (state.cat !== 'Todos' && !products.some(function (p) { return p.cat === state.cat; })) state.cat = 'Todos';
    $('srcNote').textContent = note;
    renderChips(); renderGrid();
  }

  function init() {
    $('igLink').href = 'https://ig.me/m/' + CONFIG.IG_USER;
    $('igLink').textContent = '@' + CONFIG.IG_USER;

    var q = $('q'), clr = $('qclear');
    q.addEventListener('input', function () {
      state.q = q.value.trim(); clr.classList.toggle('on', !!q.value); renderGrid();
    });
    clr.addEventListener('click', function () { q.value = ''; state.q = ''; clr.classList.remove('on'); renderGrid(); q.focus(); });
    $('onlyAvail').addEventListener('change', function (e) { state.onlyAvail = e.target.checked; renderGrid(); });
    $('reset').addEventListener('click', function () {
      state.q = ''; state.cat = 'Todos'; state.onlyAvail = false;
      q.value = ''; clr.classList.remove('on'); $('onlyAvail').checked = false; renderChips(); renderGrid();
    });
    $('dx').addEventListener('click', closeDetail);
    $('dlg').addEventListener('click', function (e) { if (e.target === $('dlg')) closeDetail(); });

    // 1) Pinta de inmediato con los datos incluidos (nunca queda en blanco)
    setData(FALLBACK, 'Catálogo guardado en la página.');

    // 2) Intenta actualizar desde Google Sheets
    if (!CONFIG.LIVE || typeof fetch !== 'function') return;
    var url = 'https://docs.google.com/spreadsheets/d/' + CONFIG.SHEET_ID +
              '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(CONFIG.SHEET_NAME);
    fetch(url).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (txt) {
      var rows = rowsFromSheet(txt);
      if (!rows) throw new Error('La hoja no devolvió el formato esperado');
      setData(rows, 'Inventario sincronizado con la hoja de cálculo.');
    }).catch(function (err) {
      if (window.console) console.warn('[FSS] No se pudo leer la hoja; se usan los datos incluidos.', err);
    });
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== $('q') && !$('dlg').open) { e.preventDefault(); $('q').focus(); }
  });

  try {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  } catch (err) {
    var m = document.createElement('div');
    m.className = 'fatal';
    m.textContent = 'No se pudo cargar el catálogo: ' + err.message;
    document.body.appendChild(m);
    if (window.console) console.error(err);
  }
})();
</script>
</body>
</html>
